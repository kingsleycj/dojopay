services:
  - type: web
    name: dojopay-backend
    env: node
    plan: free
    rootDir: backend
    # `npm ci` is reproducible and Render already installs before building, so
    # `npm run build` no longer shells out to another install.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets NODE_ENV=production, which makes npm skip devDependencies.
      # dotenv, prisma and tsx are runtime dependencies for that reason.
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: RPC_URL
        sync: false
      # Wallet that receives task funding and settles payouts. Must match the
      # frontend's NEXT_PUBLIC_PLATFORM_WALLET_ADDRESS.
      - key: PLATFORM_WALLET_ADDRESS
        sync: false
      - key: PRIVATE_KEY
        sync: false
      # Object storage: Cloudflare R2. The endpoint is derived from the account
      # id, and the region is always the literal "auto" — there is no region
      # variable to set.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Where uploaded objects are publicly readable — an r2.dev subdomain or a
      # custom domain. NOT the S3 API endpoint. Buckets are private by default,
      # so without this every task image 404s for workers.
      - key: R2_PUBLIC_URL
        sync: false
      # User sessions. One token per person; roles resolve from profiles.
      - key: JWT_SECRET
        generateValue: true
      # Admin sessions. Independently generated — a shared secret would let any
      # user token be replayed against the admin API.
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Transactional email. Required in production: without it nobody can
      # verify an address or recover an account.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Google sign-in. Optional — leave unset to disable the Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
